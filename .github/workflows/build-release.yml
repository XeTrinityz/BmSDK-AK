name: "Create release build"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name used in the package name"
        type: string
        required: false
      target_ref:
        description: "Ref to checkout and build"
        type: string
        required: false
        default: "main-bm4"
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag name used in the package name"
        type: string
        required: true
      target_ref:
        description: "Ref to checkout and build"
        type: string
        required: false
        default: "main-bm4"
    outputs:
      artifact-id:
        description: "Artifact ID of final binary"
        value: ${{ jobs.create-package.outputs.artifact-id }}
      manager-artifact-id:
        description: "Artifact ID of the manager executable"
        value: ${{ jobs.build-manager.outputs.artifact-id }}

env:
  TARGET_REF: ${{ inputs.target_ref || 'main-bm4' }}
  STAGING_DIR: '${{ github.workspace }}/publish/'

jobs:
  build-sdk:
    name: "Build BmSDK.csproj"
    runs-on: windows-latest
    env:
      PROJ_PATH: '${{ github.workspace }}/src/BmSDK/BmSDK.csproj'
    steps:
    - name: "Checkout target commit"
      uses: actions/checkout@v7
      with:
        ref: ${{ env.TARGET_REF }}

    - name: "Set up .NET SDK"
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: "Build BmSDK in Release mode"
      run: >
        dotnet publish '${{ env.PROJ_PATH }}' -c Release
        -o '${{ env.STAGING_DIR }}/Binaries/Win64/sdk/'
        -p:RestoreLockedMode=true --nologo

    - name: "Upload binaries for later processing"
      uses: actions/upload-artifact@v7
      with:
        name: "SDK"
        path: ${{ env.STAGING_DIR }}
        if-no-files-found: error

  build-host:
    name: "Build BmSDK.Host.vcxproj"
    runs-on: windows-latest
    steps:
    - name: "Checkout target commit"
      uses: actions/checkout@v7
      with:
        ref: ${{ env.TARGET_REF }}

    - name: "Set up MSBuild"
      uses: microsoft/setup-msbuild@v3

    - name: "Install VCPKG"
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgConfigurationJsonGlob: '**/src/BmSDK.Host/vcpkg-configuration.json'

    - name: "Build BmSDK.Host in Release mode"
      run: |
        # Set up dependency resolution
        vcpkg integrate install

        # Build BmSDK.Host
        MSBuild `
          '${{ github.workspace }}/src/BmSDK.Host/BmSDK.Host.vcxproj' `
          -p:Configuration=Release -p:Platform=x64 `
          -p:OutDir='${{ env.STAGING_DIR }}/Binaries/Win64/plugins/' `
          -v:m -nologo

    - name: "Upload binaries for later processing"
      uses: actions/upload-artifact@v7
      with:
        name: "Host"
        path: ${{ env.STAGING_DIR }}
        if-no-files-found: error

  create-package:
    name: "Create a complete ZIP"
    needs: [build-sdk, build-host]
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout target commit"
      uses: actions/checkout@v7
      with:
        ref: ${{ env.TARGET_REF }}

    - name: "Merge build artifacts into one directory"
      uses: actions/download-artifact@v8
      with:
        path: ${{ env.STAGING_DIR }}
        merge-multiple: true

    - name: "Retrieve latest Ultimate ASI Loader DLL"
      run: |
        curl -L -o './dinput8-x64.zip' \
          'https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/dinput8-x64.zip'
        unzip -d './dinput8-x64/' './dinput8-x64.zip'
        mv './dinput8-x64/dinput8.dll' '${{ env.STAGING_DIR }}/Binaries/Win64/'

    - name: "Copy over ScriptsDev"
      run: |
        # Maps source paths relative to the repo root to
        # destination paths relative to the export directory
        declare -A requiredFiles=(
          ['README.md']='README.md'
          ['LICENSE.md']='LICENSE.md'
          ['bin/Binaries/Win64/steam_appid.txt']='Binaries/Win64/steam_appid.txt'
          ['bin/BmGame/ScriptsDev/ScriptsDev.csproj']='BmGame/ScriptsDev/ScriptsDev.csproj'
          ['bin/BmGame/ScriptsDev/ScriptsDev.slnx']='BmGame/ScriptsDev/ScriptsDev.slnx'
          ['bin/BmGame/ScriptsDev/ScriptsDev.code-workspace']='BmGame/ScriptsDev/ScriptsDev.code-workspace'
          ['bin/BmGame/ScriptsDev/Properties/']='BmGame/ScriptsDev/Properties/'
        )

        # Copy over files to export directory
        for srcKey in "${!requiredFiles[@]}"; do
          srcPath="${{ github.workspace }}/${srcKey}"
          dstPath="${{ env.STAGING_DIR }}/${requiredFiles[$srcKey]}"
          mkdir -p "$(dirname "$dstPath")"
          cp -r "$srcPath" "$dstPath"
        done

    - name: "Uploading complete build"
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: "BmSDK-AK-${{ inputs.tag_name || inputs.target_ref || github.sha }}"
        path: ${{ env.STAGING_DIR }}
        if-no-files-found: error
        compression-level: 9

  build-manager:
    name: "Build BmSDK Manager"
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    runs-on: windows-latest
    env:
      APP_DIR: '${{ github.workspace }}/src/BmSDK.Manager'
      MANAGER_DIR: '${{ github.workspace }}/publish/manager/'
      # Baked into the exe so it updates from the repo that released it
      BMSDK_REPO: ${{ github.repository }}
    steps:
    - name: "Checkout target commit"
      uses: actions/checkout@v7
      with:
        ref: ${{ env.TARGET_REF }}

    - name: "Set up Node"
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: src/BmSDK.Manager/package-lock.json

    - name: "Cache Rust build"
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src/BmSDK.Manager/src-tauri -> target"

    - name: "Build the manager"
      working-directory: ${{ env.APP_DIR }}
      run: |
        npm ci --no-audit --no-fund
        npx tauri build

    - name: "Collect the exe"
      run: |
        New-Item -ItemType Directory -Force '${{ env.MANAGER_DIR }}' | Out-Null
        Copy-Item '${{ env.APP_DIR }}/src-tauri/target/release/BmSDK-Manager.exe' '${{ env.MANAGER_DIR }}'

    - name: "Uploading manager"
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: "Manager"
        path: ${{ env.MANAGER_DIR }}
        if-no-files-found: error
